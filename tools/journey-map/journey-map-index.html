<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FurBabyHealth — Customer Journey Map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#0a0a0a;--white:#ffffff;--off:#f7f7f7;--rule:#e8e8e8;
  --accent:#1a3a5c;--accent2:#6b8f71;--sage:#6b8f71;--sage-lt:#eef4ef;--muted:#6b6b6b;
  --green:#4a7c6f;--red:#b03030;--amber:#b87a10;
  --phase1:#1a3a5c;--phase2:#2a6b6b;--phase3:#c8662a;--phase4:#4a7c6f;--gold:#c8921a;--gold-lt:#fdf5e0;
  --font:'Inter',sans-serif;
  --col-w:180px;--row-label-w:148px;--row-h-min:80px;
}
html,body{background:var(--off);color:var(--ink);font-family:var(--font);font-size:13px;line-height:1.5;height:100%;overflow-x:hidden;}
a{color:var(--accent);text-decoration:none;}

/* ── TOOLBAR ── */
.toolbar{position:sticky;top:0;z-index:200;background:var(--accent);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,.2);}
.brand{font-family:var(--font);font-size:18px;color:white;font-weight:800;letter-spacing:-.03em;}
.brand span{color:rgba(255,255,255,.5);font-style:normal;font-weight:400;font-size:13px;margin-left:8px;}
.tb-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.tb-btn{background:white;color:var(--ink);border:2px solid white;border-radius:6px;padding:7px 14px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tb-btn:hover{background:transparent;color:white;}
.tb-btn.primary{background:var(--gold);border:2px solid var(--gold);color:white;}
.tb-btn.primary:hover{background:#a8521f;border-color:#a8521f;color:white;}
.tb-hint{font-size:11px;color:rgba(255,255,255,.5);font-style:italic;}

/* ── MAP CONTAINER ── */
.map-outer{overflow-x:auto;padding:0 0 40px;}
.map-wrap{display:inline-flex;flex-direction:column;min-width:100%;}

/* ── STAGE HEADER ROW ── */
.stage-header-row{display:flex;position:sticky;top:52px;z-index:100;}

/* ── PHASE BANNERS ── */
.phase-banner-row{display:flex;position:sticky;top:52px;z-index:101;}
.phase-banner-spacer{width:var(--row-label-w);flex-shrink:0;background:var(--gold);}
.phase-banner{flex-shrink:0;padding:5px 12px;display:flex;align-items:center;gap:6px;border-left:1px solid rgba(255,255,255,.15);}
.phase-banner-label{font-family:var(--font);font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:white;}
.phase-banner-count{font-size:9px;color:rgba(255,255,255,.45);font-weight:500;}

/* ── STAGE HEADERS ── */
.stage-header-row{display:flex;position:sticky;top:81px;z-index:100;}
.stage-header-spacer{width:var(--row-label-w);flex-shrink:0;background:var(--gold);}
.stage-header-spacer{width:var(--row-label-w);flex-shrink:0;background:var(--gold);}
.stage-col-header{width:var(--col-w);flex-shrink:0;background:var(--ink);border-left:1px solid rgba(255,255,255,.12);padding:10px 12px;position:relative;}
.stage-col-header .stage-name{font-family:var(--font);font-size:11px;font-weight:800;color:white;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;cursor:text;}
.stage-col-header .stage-arrow{position:absolute;right:-10px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:20px solid transparent;border-bottom:20px solid transparent;border-left:10px solid var(--ink);z-index:1;}
.stage-col-header:last-child .stage-arrow{display:none;}
.stage-col-header .col-actions{display:flex;gap:4px;margin-top:6px;}
.col-act-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.7);border-radius:3px;padding:2px 6px;font-size:10px;cursor:pointer;}
/* Phase-tinted cell top border set dynamically via JS */
.cell-phase-1{border-top:3px solid #1a3a5c !important;}
.cell-phase-2{border-top:3px solid #2a6b6b !important;}
.cell-phase-3{border-top:3px solid #c8662a !important;}
.cell-phase-4{border-top:3px solid #4a7c6f !important;}
.col-act-btn:hover{background:rgba(255,255,255,.25);color:white;}

/* ── DATA ROWS ── */
.map-row{display:flex;border-bottom:1px dashed var(--rule);}
.map-row:last-child{border-bottom:none;}
.map-row.hidden .row-cells{display:none;}

.row-label{width:var(--row-label-w);flex-shrink:0;background:var(--gold);color:white;padding:12px 12px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;border-top:1px solid rgba(255,255,255,.12);}
.row-label-name{font-family:var(--font);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.3;color:rgba(255,255,255,.95);}
.row-toggle{background:none;border:none;color:rgba(255,255,255,.55);cursor:pointer;font-size:10px;margin-top:4px;padding:0;text-align:left;}
.row-toggle:hover{color:white;}

.row-cells{display:flex;flex:1;}
.cell{width:var(--col-w);flex-shrink:0;min-height:var(--row-h-min);border-left:1px solid var(--rule);padding:10px 11px;background:var(--cream);position:relative;transition:background .15s;}
.cell:hover{background:#f0f4f8;}
.cell:focus-within{background:#fff;outline:2px solid var(--accent);outline-offset:-2px;z-index:5;}
.cell-content{font-size:12px;color:var(--ink);line-height:1.6;min-height:20px;outline:none;cursor:text;}
.cell-content:empty::before{content:attr(data-placeholder);color:#bbb;font-style:italic;pointer-events:none;}

/* Row-specific backgrounds */
.row-activities .cell{background:var(--white);}
.row-goals .cell{background:#fafafa;}
.row-touchpoints .cell{background:#f2f6f8;}
.row-experience .cell{background:var(--off);padding-top:0;padding-bottom:0;}
.row-bizgoal .cell{background:#f4f7f4;}
.row-kpis .cell{background:#f4f4fb;}
.row-orgact .cell{background:#fdf7f4;}
.row-responsible .cell{background:var(--off);}
.row-tech .cell{background:#f3f7f7;}

/* ── EXPERIENCE ROW ── */
.exp-row-inner{display:flex;position:relative;}
.exp-scale{width:40px;flex-shrink:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px 0;border-right:1px solid var(--rule);}
.exp-emoji{font-size:14px;text-align:center;line-height:1;}
.exp-chart-area{flex:1;position:relative;height:120px;}
#exp-svg{width:100%;height:100%;overflow:visible;}
.exp-label-row{display:flex;}
.exp-label-cell{width:var(--col-w);flex-shrink:0;border-left:1px solid var(--rule);padding:4px 8px;font-size:10px;font-style:italic;color:var(--muted);min-height:28px;cursor:text;outline:none;}
.exp-label-cell:focus{background:#fff;outline:2px solid var(--accent);outline-offset:-2px;}
.exp-label-cell:empty::before{content:"Add sentiment label...";color:#ccc;pointer-events:none;}

/* Sentiment point draggable */
.exp-point{cursor:ns-resize;transition:r .15s;}
.exp-point:hover{r:9;}
.exp-line{fill:none;stroke:var(--gold);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;}
.exp-area{fill:none;fill-opacity:0;}

/* ── CHIPS / TAGS ── */
.chip-area{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.chip{display:inline-block;background:#e8eef4;color:var(--accent);border-radius:3px;padding:2px 7px;font-size:10px;font-weight:600;cursor:default;}
.chip.warm{background:#fdf0e8;color:var(--accent2);}

/* ── TOUCHPOINT ICONS ── */
.tp-icons{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.tp-icon{width:28px;height:28px;border-radius:6px;background:var(--teal-lt);border:1px solid #b8dada;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .15s;}
.tp-icon:hover{background:var(--teal-dk);border-color:var(--teal-dk);}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:white;border-radius:12px;padding:28px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2);transform:translateY(10px);transition:transform .2s;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal h3{font-family:var(--font);font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:16px;color:var(--accent);}
.modal textarea{width:100%;height:200px;border:1.5px solid var(--rule);border-radius:7px;padding:12px;font-family:'Courier New',monospace;font-size:11px;resize:vertical;outline:none;color:var(--ink);}
.modal textarea:focus{border-color:var(--accent);}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
.modal-btn{padding:9px 20px;border-radius:6px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;border:none;}
.modal-btn.close{background:var(--off);color:var(--ink);}
.modal-btn.go{background:var(--gold);color:white;}

/* ── FOOTER ── */
.map-footer{padding:16px 24px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;align-items:center;background:white;font-size:11px;color:var(--muted);font-weight:500;}

@media(max-width:640px){:root{--col-w:140px;--row-label-w:100px;}}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="brand">FurBabyHealth <span>Customer Journey Map</span></div>
  <div class="tb-actions">
    <span class="tb-hint">Click any cell to edit &nbsp;·&nbsp; Drag sentiment points &nbsp;·&nbsp; </span>
    <button class="tb-btn" onclick="addStage()">+ Add Stage</button>
    <button class="tb-btn" onclick="toggleRowPanel()">Toggle Rows</button>
    <button class="tb-btn" onclick="exportJSON()">Export JSON</button>
    <button class="tb-btn primary" onclick="copyForAI()">Copy for AI &#8599;</button>
  </div>
</div>

<!-- MAP -->
<div class="map-outer">
<div class="map-wrap" id="map-wrap">

  <!-- PHASE BANNER ROW -->
  <div class="phase-banner-row" id="phase-banners">
    <div class="phase-banner-spacer"></div>
    <!-- Populated by JS -->
  </div>

  <!-- STAGE HEADERS -->
  <div class="stage-header-row" id="stage-headers">
    <div class="stage-header-spacer"></div>
    <!-- Populated by JS -->
  </div>

  <!-- ROWS -->
  <div id="rows-container">
    <!-- Populated by JS -->
  </div>

</div>
</div>

<!-- EXPERIENCE LABEL ROW (outside main grid, appended by JS) -->

<!-- EXPORT MODAL -->
<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <h3>Export / AI Output</h3>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-actions">
      <button class="modal-btn go" onclick="copyExport()">Copy to clipboard</button>
      <button class="modal-btn close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<div class="map-footer">
  <span>FurBabyHealth &mdash; Customer Journey Map &mdash; Editable template</span>
  <span>Click any cell to edit &nbsp;&middot;&nbsp; Drag &bull; points to adjust sentiment curve</span>
</div>

<script>
// ── DATA ────────────────────────────────────────────────────────
// ── PHASE GROUPS ────────────────────────────────────────────────
const PHASES = [
  {label:'Pre-Enrollment',             stageIds:['s1','s2','s3'],         color:'#1a3a5c'},
  {label:'Account Management',         stageIds:['s4','s5'],              color:'#2a6b6b'},
  {label:'Claims and Services',        stageIds:['s6','s7'],              color:'#c8662a'},
  {label:'Recommendations and Renewals',stageIds:['s8'],                  color:'#4a7c6f'},
];

const STAGES = [
  {
    id:'s1', name:'AWARENESS',
    activities:'Pet owner hears about FurBabyHealth via vet recommendation, social media ad, or friend referral. Searches online for pet insurance.',
    goals:'Understand that pet insurance exists and that FurBabyHealth covers their pet type and breed.',
    touchpoints:['web','social','vet','word-of-mouth'],
    touchpointText:'Social media, Google search, vet clinic flyers, friend referral, pet store displays',
    experience:3,
    expLabel:'Curious but skeptical',
    bizGoal:'Build brand awareness and drive qualified traffic to website and app stores.',
    kpis:'Impressions, website visits, app downloads, vet referral count',
    orgActivities:'Content marketing, vet partnership program, social campaigns, SEO, app store optimization',
    responsible:'Marketing, Vet Partnerships',
    tech:'CRM, analytics, social scheduling tools, vet PMS integration (Avimark, Cornerstone, ezyVet) for referral tracking'
  },
  {
    id:'s2', name:'RESEARCH & COMPARE',
    activities:'Compares plans, deductibles, reimbursement rates. Reads reviews. Uses coverage calculator. May call helpline.',
    goals:'Find the right plan for their pet\'s breed, age, and health history. Understand exclusions.',
    touchpoints:['web','mobile','phone'],
    touchpointText:'Website plan comparison tool, mobile app, review sites (Trustpilot, Google), phone helpline',
    experience:2,
    expLabel:'Overwhelmed by options',
    bizGoal:'Increase plan page dwell time and quote completions. Reduce call volume with self-serve tools.',
    kpis:'Quote completions, comparison tool usage, call deflection rate, time on plan pages',
    orgActivities:'Plan comparison UX, coverage calculator, breed-specific content, live chat, FAQ optimization',
    responsible:'Product, Marketing, Customer Service',
    tech:'Web analytics, chatbot platform, CRM, vet PMS breed/condition data for exclusion transparency'
  },
  {
    id:'s3', name:'ENROLLMENT',
    activities:'Selects plan, enters pet details, connects vet practice, sets up payment. Reviews and signs policy.',
    goals:'Enroll quickly and confidently. Understand what is covered from day one.',
    touchpoints:['web','mobile','email'],
    touchpointText:'Web enrollment flow, mobile app, confirmation email, policy document download',
    experience:4,
    expLabel:'Relieved and confident',
    bizGoal:'Maximize enrollment completion rate. Minimize drop-off at payment and vet connection steps.',
    kpis:'Enrollment completion rate, drop-off by step, time to complete, vet connection rate at enrollment',
    orgActivities:'Enrollment UX optimization, vet practice search and connection, payment setup, policy issuance',
    responsible:'Product, Engineering, Underwriting',
    tech:'Web/mobile enrollment platform, payment gateway (Stripe), vet PMS API (Cornerstone, ezyVet, AVImark, Shepherd) for practice lookup and connection'
  },
  {
    id:'s4', name:'ONBOARDING & VET SETUP',
    activities:'Receives welcome kit. Sets up member profile. Connects vet practice to FurBabyHealth portal. Pet health history imported.',
    goals:'Have FurBabyHealth fully connected to their vet so coverage is seamless from the first visit.',
    touchpoints:['email','mobile','web','vet'],
    touchpointText:'Welcome email series, mobile app, web member portal, vet practice notification, FurBabyHealth provider portal',
    experience:4,
    expLabel:'Excited — feels set up',
    bizGoal:'Drive vet practice activation and health history import. Reduce future claim friction.',
    kpis:'Vet practice activation rate, health history import rate, member profile completion, app activation rate',
    orgActivities:'Welcome journey automation, vet practice onboarding, health history import via PMS API, member portal setup',
    responsible:'Customer Success, Engineering, Vet Partnerships',
    tech:'Mobile app, member portal, vet PMS integration (Cornerstone, ezyVet, AVImark, Shepherd, IDEXX) for health history pull, marketing automation'
  },
  {
    id:'s5', name:'ONGOING CARE',
    activities:'Pet has routine vet visits. Member receives wellness reminders. Preventive care benefits used. Vet submits visit records automatically.',
    goals:'Get value from the plan between claims. Trust that FurBabyHealth is working in the background.',
    touchpoints:['mobile','vet','email'],
    touchpointText:'Mobile app wellness tracker, push notifications, vet visit automatic record sync, email reminders',
    experience:5,
    expLabel:'Satisfied — invisible value',
    bizGoal:'Demonstrate ongoing value to reduce churn. Drive preventive care benefit utilization.',
    kpis:'Preventive care utilization rate, app engagement, wellness reminder open rate, vet visit record sync rate',
    orgActivities:'Wellness reminder automation, preventive care benefit tracking, vet PMS auto-sync of visit records, member engagement programs',
    responsible:'Customer Success, Product, Vet Partnerships',
    tech:'Mobile app, push notification platform, vet PMS real-time integration (IDEXX, ezyVet, Cornerstone) for automatic record sync, member portal'
  },
  {
    id:'s6', name:'CLAIM SUBMISSION',
    activities:'Pet has unexpected illness or injury. Member submits claim via app — photos of invoice, or vet submits directly from PMS.',
    goals:'Submit a claim quickly and easily. Understand what is covered and what to expect.',
    touchpoints:['mobile','web','vet'],
    touchpointText:'Mobile app claim submission, web portal, vet direct submission from PMS, email confirmation',
    experience:2,
    expLabel:'Stressed — pet is unwell',
    bizGoal:'Drive direct PMS submission to reduce manual effort. Achieve <5 min claim submission time.',
    kpis:'Claim submission time, direct PMS submission rate, photo upload completion rate, submission error rate',
    orgActivities:'Claim submission UX, vet direct submission integration, invoice OCR, real-time coverage check, submission confirmation',
    responsible:'Product, Engineering, Claims',
    tech:'Mobile app, web portal, vet PMS direct submission API (Cornerstone, ezyVet, AVImark), OCR invoice processing, coverage verification engine'
  },
  {
    id:'s7', name:'CLAIM RESOLUTION',
    activities:'Claim reviewed and processed. Member receives real-time status updates. Reimbursement issued to bank account or vet paid directly.',
    goals:'Receive fair reimbursement quickly with clear explanation of what was paid and why.',
    touchpoints:['mobile','email','web'],
    touchpointText:'Mobile app status updates, email notifications, member portal claim detail, bank transfer, direct vet payment',
    experience:3,
    expLabel:'Anxious — waiting for outcome',
    bizGoal:'Achieve <5 day claim resolution. Minimize appeals. Maximize first-contact resolution.',
    kpis:'Claim resolution time, appeal rate, first-contact resolution rate, member satisfaction score post-claim',
    orgActivities:'Claims adjudication, vet record retrieval via PMS, direct vet payment, reimbursement processing, EOB generation',
    responsible:'Claims, Finance, Engineering',
    tech:'Claims management system, vet PMS API for record retrieval (IDEXX, Cornerstone, ezyVet), payment processing, member communication platform'
  },
  {
    id:'s8', name:'RENEWAL & ADVOCACY',
    activities:'Receives renewal notice. Reviews coverage. Upgrades plan if needed. Refers friends and family. Leaves review.',
    goals:'Continue coverage with confidence. Share positive experience with other pet owners.',
    touchpoints:['email','mobile','web','social'],
    touchpointText:'Renewal email, mobile app renewal flow, referral program, social sharing, review prompts (Google, Trustpilot)',
    experience:5,
    expLabel:'Loyal — recommends FurBabyHealth',
    bizGoal:'Maximize renewal rate and referral conversion. Turn claims winners into advocates.',
    kpis:'Renewal rate, plan upgrade rate, referral conversion rate, NPS, online review volume and rating',
    orgActivities:'Renewal campaign, plan upgrade prompts, referral program, review generation, loyalty benefits',
    responsible:'Customer Success, Marketing',
    tech:'CRM, marketing automation, referral platform, review management tools, member portal renewal flow'
  }
];

const ROWS = [
  {id:'activities', label:'Customer Activities', cls:'row-activities', field:'activities', placeholder:'What is the customer doing at this stage?'},
  {id:'goals',      label:'Customer Goals',      cls:'row-goals',      field:'goals',      placeholder:'What does the customer want to achieve?'},
  {id:'touchpoints',label:'Touchpoints',         cls:'row-touchpoints',field:'touchpointText',placeholder:'Channels and interfaces the customer uses'},
  {id:'experience', label:'Experience',          cls:'row-experience', field:null,         placeholder:null},
  {id:'bizgoal',    label:'Business Goal (OKR)',  cls:'row-bizgoal',    field:'bizGoal',    placeholder:'What does FurBabyHealth want to achieve at this stage?'},
  {id:'kpis',       label:'Outcome Metrics (KPIs)',cls:'row-kpis',      field:'kpis',       placeholder:'How do we measure success?'},
  {id:'orgact',     label:'Org. Activities',     cls:'row-orgact',     field:'orgActivities',placeholder:'What internal work is required?'},
  {id:'responsible',label:'Responsible',         cls:'row-responsible',field:'responsible',placeholder:'Team or role accountable'},
  {id:'tech',       label:'Technology & Systems',cls:'row-tech',       field:'tech',       placeholder:'Systems, APIs, integrations involved'}
];

const TP_ICONS = {web:'🖥',mobile:'📱',email:'✉️',phone:'📞',vet:'🏥',social:'💬','word-of-mouth':'👥'};

// ── BUILD ────────────────────────────────────────────────────────
function build() {
  buildPhaseBanners();
  buildHeaders();
  buildRows();
}

function buildPhaseBanners() {
  const row = document.getElementById('phase-banners');
  while(row.children.length > 1) row.removeChild(row.lastChild);
  PHASES.forEach(phase => {
    const stageCount = phase.stageIds.filter(id => STAGES.some(s=>s.id===id)).length;
    if(stageCount === 0) return;
    const div = document.createElement('div');
    div.className = 'phase-banner';
    div.style.background = phase.color;
    div.style.width = (stageCount * 180) + 'px';
    div.innerHTML = `<span class="phase-banner-label">${phase.label}</span>
      <span class="phase-banner-count">${stageCount} stage${stageCount>1?'s':''}</span>`;
    row.appendChild(div);
  });
}

function buildHeaders() {
  const hdr = document.getElementById('stage-headers');
  // Clear existing stage headers (keep spacer)
  while(hdr.children.length > 1) hdr.removeChild(hdr.lastChild);
  STAGES.forEach((s,i) => {
    const phase = PHASES.find(p=>p.stageIds.includes(s.id));
    const phaseColor = phase ? phase.color : '#0a0a0a';
    const div = document.createElement('div');
    div.className = 'stage-col-header';
    div.dataset.sid = s.id;
    div.style.background = phaseColor;
    div.innerHTML = `
      <div class="stage-name" contenteditable="true" spellcheck="false"
        onblur="updateStageName('${s.id}',this.textContent)">${s.name}</div>
      <div class="col-actions">
        <button class="col-act-btn" onclick="removeStage('${s.id}')" title="Remove stage">✕</button>
        <button class="col-act-btn" onclick="moveStage('${s.id}',-1)" title="Move left">←</button>
        <button class="col-act-btn" onclick="moveStage('${s.id}',1)" title="Move right">→</button>
      </div>
      <div class="stage-arrow" style="border-left-color:${phaseColor}"></div>`;
    hdr.appendChild(div);
  });
}

function buildRows() {
  const container = document.getElementById('rows-container');
  container.innerHTML = '';
  ROWS.forEach(row => {
    if(row.id === 'experience') {
      container.appendChild(buildExperienceRow());
      return;
    }
    const rowDiv = document.createElement('div');
    rowDiv.className = `map-row ${row.cls}`;
    rowDiv.dataset.rowid = row.id;
    const label = document.createElement('div');
    label.className = 'row-label';
    label.innerHTML = `<div class="row-label-name">${row.label}</div>
      <button class="row-toggle" onclick="toggleRow('${row.id}')">hide</button>`;
    const cells = document.createElement('div');
    cells.className = 'row-cells';
    STAGES.forEach(s => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.sid = s.id;
      cell.dataset.field = row.field;
      const content = document.createElement('div');
      content.className = 'cell-content';
      content.contentEditable = 'true';
      content.spellcheck = false;
      content.setAttribute('data-placeholder', row.placeholder);
      content.textContent = s[row.field] || '';
      content.addEventListener('blur', () => { s[row.field] = content.textContent; });
      cell.appendChild(content);
      cells.appendChild(cell);
    });
    rowDiv.appendChild(label);
    rowDiv.appendChild(cells);
    container.appendChild(rowDiv);
  });
}

function buildExperienceRow() {
  const rowDiv = document.createElement('div');
  rowDiv.className = 'map-row row-experience';
  rowDiv.dataset.rowid = 'experience';
  rowDiv.style.flexDirection = 'column';

  const label = document.createElement('div');
  label.className = 'row-label';
  label.style.cssText = 'position:absolute;top:0;left:0;height:100%;';
  label.innerHTML = `<div class="row-label-name">Experience</div>
    <button class="row-toggle" onclick="toggleRow('experience')">hide</button>`;

  // Main chart area
  const chartWrap = document.createElement('div');
  chartWrap.style.cssText = `display:flex;margin-left:var(--row-label-w);border-top:1px solid var(--rule);position:relative;`;

  // Scale on left
  const scale = document.createElement('div');
  scale.className = 'exp-scale';
  scale.innerHTML = ['😄','😊','😐','😟','😣'].map(e=>`<div class="exp-emoji">${e}</div>`).join('');

  // SVG chart
  const chartArea = document.createElement('div');
  chartArea.className = 'exp-chart-area';
  chartArea.id = 'exp-chart-area';

  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.id = 'exp-svg';
  svg.setAttribute('viewBox',`0 0 ${STAGES.length*180} 120`);
  svg.setAttribute('preserveAspectRatio','none');

  // Grid lines
  for(let i=1;i<5;i++){
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',0);l.setAttribute('x2',STAGES.length*180);
    const y=i*24;
    l.setAttribute('y1',y);l.setAttribute('y2',y);
    l.setAttribute('stroke','#e0dbd0');l.setAttribute('stroke-width','0.5');
    svg.appendChild(l);
  }

  // Area fill
  const area = document.createElementNS('http://www.w3.org/2000/svg','path');
  area.id='exp-area';area.className='exp-area';
  svg.appendChild(area);

  // Line
  const line = document.createElementNS('http://www.w3.org/2000/svg','path');
  line.id='exp-line';line.className='exp-line';
  svg.appendChild(line);

  // Points (draggable)
  STAGES.forEach((s,i)=>{
    const cx = i*180 + 90;
    const cy = scoreToY(s.experience);
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',cx);
    circle.setAttribute('cy',cy);
    circle.setAttribute('r',7);
    circle.setAttribute('fill',scoreToColor(s.experience));
    circle.setAttribute('stroke','white');
    circle.setAttribute('stroke-width',2);
    circle.className='exp-point';
    circle.id=`ep-${s.id}`;
    makeDraggable(circle, s);
    svg.appendChild(circle);
  });

  chartArea.appendChild(svg);
  chartWrap.appendChild(scale);
  chartWrap.appendChild(chartArea);

  // Sentiment label row
  const labelRow = document.createElement('div');
  labelRow.className = 'exp-label-row';
  labelRow.style.marginLeft = 'calc(var(--row-label-w) + 40px)';
  STAGES.forEach(s=>{
    const lc = document.createElement('div');
    lc.className = 'exp-label-cell';
    lc.contentEditable = 'true';
    lc.textContent = s.expLabel || '';
    lc.addEventListener('blur',()=>{s.expLabel=lc.textContent;});
    labelRow.appendChild(lc);
  });

  // Outer wrapper with relative position for label
  const outerWrap = document.createElement('div');
  outerWrap.style.position = 'relative';
  outerWrap.style.display = 'flex';
  outerWrap.style.flexDirection = 'column';
  outerWrap.appendChild(label);
  outerWrap.appendChild(chartWrap);
  outerWrap.appendChild(labelRow);

  rowDiv.appendChild(outerWrap);
  updateExpCurve();
  return rowDiv;
}

function scoreToY(score) {
  // score 1-5, 5=happy=top(y=12), 1=sad=bottom(y=108)
  return 12 + (5-score)*24;
}
function yToScore(y) {
  return Math.max(1,Math.min(5, Math.round(5-(y-12)/24)));
}
function scoreToColor(score){
  if(score>=5) return '#2d7a4a';
  if(score>=4) return '#4a7c6f';
  if(score===3) return '#b87a10';
  if(score===2) return '#c8662a';
  return '#b03030';
}

function updateExpCurve(){
  const totalW = STAGES.length*180;
  const line = document.getElementById('exp-line');
  const area = document.getElementById('exp-area');
  if(!line||!area) return;

  const points = STAGES.map((s,i)=>({x:i*180+90, y:scoreToY(s.experience)}));
  let d='M '+points.map(p=>`${p.x} ${p.y}`).join(' L ');
  line.setAttribute('d',d);
  let areaD=`M ${points[0].x} 120 L ${points.map(p=>`${p.x} ${p.y}`).join(' L ')} L ${points[points.length-1].x} 120 Z`;
  area.setAttribute('d',areaD);

  // Update point positions and colors
  STAGES.forEach((s,i)=>{
    const circle = document.getElementById(`ep-${s.id}`);
    if(circle){
      circle.setAttribute('cy',scoreToY(s.experience));
      circle.setAttribute('fill',scoreToColor(s.experience));
    }
  });

  // Update SVG viewBox
  const svg = document.getElementById('exp-svg');
  if(svg) svg.setAttribute('viewBox',`0 0 ${totalW} 120`);
}

function makeDraggable(circle, stage){
  let dragging=false, startY=0, startScore=0;
  circle.addEventListener('mousedown',e=>{
    dragging=true; startY=e.clientY; startScore=stage.experience;
    e.preventDefault();
    document.body.style.cursor='ns-resize';
  });
  document.addEventListener('mousemove',e=>{
    if(!dragging) return;
    const dy = e.clientY - startY;
    const deltaSco = -Math.round(dy/20);
    stage.experience = Math.max(1,Math.min(5, startScore+deltaSco));
    updateExpCurve();
  });
  document.addEventListener('mouseup',()=>{
    dragging=false;
    document.body.style.cursor='';
  });
  // Touch
  circle.addEventListener('touchstart',e=>{
    dragging=true;startY=e.touches[0].clientY;startScore=stage.experience;e.preventDefault();
  },{passive:false});
  document.addEventListener('touchmove',e=>{
    if(!dragging)return;
    const dy=e.touches[0].clientY-startY;
    const deltaSco=-Math.round(dy/20);
    stage.experience=Math.max(1,Math.min(5,startScore+deltaSco));
    updateExpCurve();
  },{passive:true});
  document.addEventListener('touchend',()=>{dragging=false;});
}

// ── STAGE MANAGEMENT ────────────────────────────────────────────
function addStage(){
  const name = prompt('Stage name:','NEW STAGE');
  if(!name) return;
  const id='s'+Date.now();
  STAGES.push({id,name:name.toUpperCase(),activities:'',goals:'',touchpoints:[],touchpointText:'',experience:3,expLabel:'',bizGoal:'',kpis:'',orgActivities:'',responsible:'',tech:''});
  build();
  updateExpCurve();
}

function removeStage(id){
  if(STAGES.length<=2){alert('Minimum 2 stages required.');return;}
  if(!confirm('Remove this stage?')) return;
  const idx=STAGES.findIndex(s=>s.id===id);
  STAGES.splice(idx,1);
  build();
  updateExpCurve();
}

function moveStage(id,dir){
  const idx=STAGES.findIndex(s=>s.id===id);
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=STAGES.length) return;
  [STAGES[idx],STAGES[newIdx]]=[STAGES[newIdx],STAGES[idx]];
  build();
  updateExpCurve();
}

function updateStageName(id,name){
  const s=STAGES.find(s=>s.id===id);
  if(s) s.name=name.trim().toUpperCase();
}

function toggleRow(rowId){
  const row=document.querySelector(`[data-rowid="${rowId}"]`);
  if(row){row.classList.toggle('hidden');}
}

function toggleRowPanel(){
  const labels=['activities','goals','touchpoints','experience','bizgoal','kpis','orgact','responsible','tech'];
  const hidden=document.querySelectorAll('.map-row.hidden').length;
  if(hidden>0){
    document.querySelectorAll('.map-row.hidden').forEach(r=>r.classList.remove('hidden'));
  } else {
    // Show only essentials
    ['bizgoal','kpis','orgact','responsible','tech'].forEach(id=>{
      const row=document.querySelector(`[data-rowid="${id}"]`);
      if(row) row.classList.add('hidden');
    });
  }
}
