<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="5" fill="#f7f7f7"/>

  <!-- 9 spokes -->
  <line x1="16" y1="16" x2="16.0"  y2="5.0"   stroke="#cdd2d8" stroke-width="0.3"/>
  <line x1="16" y1="16" x2="23.07" y2="7.57"  stroke="#cdd2d8" stroke-width="0.3"/>
  <line x1="16" y1="16" x2="26.83" y2="14.09" stroke="#cdd2d8" stroke-width="0.3"/>
  <line x1="16" y1="16" x2="25.53" y2="21.5"  stroke="#cdd2d8" stroke-width="0.3"/>
  <line x1="16" y1="16" x2="19.76" y2="26.34" stroke="#cdd2d8" stroke-width="0.3"/>
  <line x1="16" y1="16" x2="12.24" y2="26.34" stroke="#cdd2d8" stroke-width="0.3"/>
  <line x1="16" y1="16" x2="6.47"  y2="21.5"  stroke="#cdd2d8" stroke-width="0.3"/>
  <line x1="16" y1="16" x2="5.17"  y2="14.09" stroke="#cdd2d8" stroke-width="0.3"/>
  <line x1="16" y1="16" x2="8.93"  y2="7.57"  stroke="#cdd2d8" stroke-width="0.3"/>

  <!-- Bold outer border — navy -->
  <polygon points="16.0,5.0 23.07,7.57 26.83,14.09 25.53,21.5 19.76,26.34 12.24,26.34 6.47,21.5 5.17,14.09 8.93,7.57"
    fill="none" stroke="#1a3a5c" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Green baseline (back) -->
  <polygon points="16.0,7.64 21.09,9.93 23.58,14.66 22.1,19.52 18.56,23.03 14.87,19.1 13.71,17.32 12.1,15.31 14.02,13.64"
    fill="#4a7c6f" fill-opacity="0.22" stroke="#4a7c6f" stroke-width="0.65" stroke-linejoin="round"/>

  <!-- Orange current (middle) -->
  <polygon points="16.0,6.1 22.08,8.75 25.1,14.4 23.62,20.4 19.09,24.48 13.89,21.79 11.24,18.75 9.5,14.85 12.18,11.45"
    fill="#c8662a" fill-opacity="0.2" stroke="#c8662a" stroke-width="0.75" stroke-linejoin="round"/>

  <!-- Navy target (front) -->
  <polygon points="16.0,5.44 22.93,7.74 25.97,14.24 24.95,21.17 19.39,25.3 12.84,24.68 8.38,20.4 7.12,14.43 9.92,8.75"
    fill="#1a3a5c" fill-opacity="0.13" stroke="#1a3a5c" stroke-width="0.85" stroke-linejoin="round"/>

  <circle cx="16" cy="16" r="1.2" fill="#1a3a5c"/>
